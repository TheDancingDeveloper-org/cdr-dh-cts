[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdr-dh-cts"
version = "0.1.0"
description = "Containerised CDR Data Holder Conformance Test Suite harness with a simulated ADR and CDR Register"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mock = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
cdr-cts = "cdr_cts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdr_cts = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
